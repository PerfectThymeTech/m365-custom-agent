[project]
name = "copilot"
version = "0.1.0"
description = "This project demonstrates the usage of the Microosft Agents SDK for building custom AI agents."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiohttp==3.13.5",
    "azure-ai-documentintelligence==1.0.2",
    "azure-monitor-opentelemetry==1.8.7",
    "fastapi[standard]==0.136.1",
    "microsoft-agents-activity==0.9.0",
    "microsoft-agents-authentication-msal==0.9.0",
    "microsoft-agents-hosting-aiohttp==0.9.0",
    "microsoft-agents-hosting-core==0.9.0",
    "microsoft-agents-hosting-fastapi==0.9.0",
    "microsoft-agents-storage-cosmos==0.9.0",
    "openai-agents==0.14.8",
    "opentelemetry-instrumentation-aiohttp-client==0.61b0",
    "pydantic-settings==2.14.0",
]

[dependency-groups]
dev = [
    "pre-commit==4.6.0",
    "pytest==9.0.3",
]

[tool.uv]
required-version = ">=0.8.9"
